# Velaris — pacman.conf (runtime)

[options]
HoldPkg      = pacman glibc
Architecture = x86_64 x86_64_v3
Color
CheckSpace
ParallelDownloads = 5
ILoveCandy
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# CachyOS — assinaturas obrigatórias; o cachyos-keyring já vem instalado.
[cachyos]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/cachyos-mirrorlist

# CachyOS v3 is enabled by the installer only when the BORE+LTO kernel is
# selected on a compatible CPU. Keep these exact commented lines: the
# selection helper enables them without exposing other systems to v3 code.
#[cachyos-v3]
#Include = /etc/pacman.d/cachyos-v3-mirrorlist
