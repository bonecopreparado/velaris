---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - wheel
  - audio
  - video
  - network
  - storage
  - optical
  - lp

autologinGroup: autologin
sudoersGroup: wheel
sudoersConfigureWithGroup: false
displayAutologin: true
doAutologin: false

# O sistema usa sudo e mantém a conta root bloqueada por padrão.
setRootPassword: false
doReusePassword: false
allowWeakPasswords: false
allowWeakPasswordsDefault: false
passwordRequirements:
  minLength: 8

user:
  shell: /usr/bin/fish
  forbidden_names:
    - root
    - adm
    - bin
    - daemon
    - dbus
    - ftp
    - games
    - halt
    - http
    - lp
    - mail
    - man
    - news
    - nobody
    - ntp
    - operator
    - polkitd
    - postfix
    - rtkit
    - shutdown
    - sync
    - sys
    - systemd-coredump
    - systemd-network
    - systemd-resolve
    - systemd-timesync
    - uucp
    - uuidd
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "velaris-${cpu}"
  forbidden_names: [ localhost ]

allowActiveDirectory: false
