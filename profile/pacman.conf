# pacman.conf — usado pelo archiso durante o BUILD
# Inclui repositórios do Arch + CachyOS

[options]
HoldPkg      = pacman glibc
Architecture = x86_64 x86_64_v3
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
# Retry automático em downloads que falharem (mirror flaky)
XferCommand = /usr/bin/curl --retry 3 --retry-delay 3 -L -C - -f -o %o %u

# ─── Repositórios Arch Linux ─────────────────────────────────────────────────
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# ─── Repositórios CachyOS ────────────────────────────────────────────────────
# O kernel linux-cachyos vem daqui
[cachyos]
Server = https://mirror.cachyos.org/repo/x86_64/$repo
Server = https://repo.cachyos.org/$repo/x86_64

# This repository is lower priority than generic CachyOS and is used only for
# the explicitly-qualified BORE+LTO kernel packages in packages.x86_64.
[cachyos-v3]
Server = https://cdn77.cachyos.org/repo/x86_64_v3/$repo
Server = https://mirror.cachyos.org/repo/x86_64_v3/$repo
