name: Build Velaris ISO

on:
  push:
    branches: [main]
    paths:
      - 'profile/**'
      - 'scripts/**'
      - 'build.sh'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'profile/**'
      - 'scripts/**'
      - 'build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: velaris-iso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ISO — lenovo-server
    # Nunca execute código de forks no runner particular. PRs criados dentro
    # deste repositório continuam permitidos e servem para validar branches.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    permissions:
      contents: read
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Confirmar runner lenovo-server
        run: |
          echo "Runner: ${RUNNER_NAME:-desconhecido} (${RUNNER_OS:-?}/${RUNNER_ARCH:-?})"
          test "${RUNNER_NAME:-}" = "lenovo-server"
          test "${RUNNER_OS:-}" = "Linux"
          test "${RUNNER_ARCH:-}" = "X64"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências de build
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            archiso git wget curl base-devel jq \
            squashfs-tools libisoburn dosfstools mtools erofs-utils \
            python python-yaml

      - name: Configurar keyring do pacman
        run: |
          pacman-key --init
          pacman-key --populate archlinux

      - name: Configurar chave CachyOS
        run: |
          pacman-key --recv-keys F3B607488DB35A47 \
            --keyserver hkps://keyserver.ubuntu.com || \
          pacman-key --recv-keys F3B607488DB35A47 \
            --keyserver hkps://keys.openpgp.org || true
          pacman-key --lsign-key F3B607488DB35A47 || true

      - name: Instalar keyring CachyOS
        run: |
          if ! grep -q "\[cachyos\]" /etc/pacman.conf; then
            printf '\n[cachyos]\nServer = https://mirror.cachyos.org/repo/x86_64/$repo\nServer = https://repo.cachyos.org/$repo/x86_64\n' \
              >> /etc/pacman.conf
          fi
          pacman -Sy --noconfirm cachyos-keyring cachyos-mirrorlist

      - name: Validar perfil e Calamares
        run: python3 scripts/validate-profile.py

      - name: Build da ISO
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload para Gofile
        run: |
          ISO_FILE=$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$ISO_FILE"
          ISO_NAME=$(basename "$ISO_FILE")
          echo "Fazendo upload de $ISO_NAME..."

          # A API atual usa proxies globais/regionais, não os antigos storeN.
          for ENDPOINT in \
            "https://upload-sa-sao.gofile.io/uploadfile" \
            "https://upload.gofile.io/uploadfile" \
            "https://upload-na-phx.gofile.io/uploadfile"; do
            echo "Tentando upload via $ENDPOINT"
            RESPONSE=$(curl -fSs \
              --connect-timeout 30 \
              --max-time 3600 \
              --retry 2 \
              --retry-delay 10 \
              --retry-connrefused \
              -F "file=@${ISO_FILE}" \
              "$ENDPOINT" || echo "")

            if echo "$RESPONSE" | jq -e '.status == "ok"' &>/dev/null; then
              DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
              FILE_CODE=$(echo "$RESPONSE" | jq -r \
                '.data.code // .data.parentFolder // .data.folderId // "n/a"')
              echo "GOFILE_URL=$DOWNLOAD_URL" >> "$GITHUB_ENV"
              echo "GOFILE_CODE=$FILE_CODE" >> "$GITHUB_ENV"
              echo "UPLOAD_OK=true" >> "$GITHUB_ENV"
              echo "Upload concluído: $DOWNLOAD_URL"
              break
            fi

            echo "Endpoint não concluiu o upload."
          done

      - name: Salva resultado no Summary
        run: |
          ISO_FILE=$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$ISO_FILE"
          ISO_SIZE=$(du -sh "$ISO_FILE" | cut -f1)

          echo "## 🐱 Velaris — Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${UPLOAD_OK:-false}" = "true" ]; then
            echo "✅ **Build e upload concluídos!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| | |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| 📥 **Download** | ${{ env.GOFILE_URL }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔑 **Código Gofile** | \`${{ env.GOFILE_CODE }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 💾 **Tamanho** | $ISO_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| 🐧 **Kernel** | linux-cachyos (BORE+LTO) |" >> $GITHUB_STEP_SUMMARY
            echo "| 🖥️ **Desktop** | KDE Plasma (debloated) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> ⚠️ Links do Gofile expiram em ~10 dias sem acesso." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Build OK mas upload falhou.**" >> $GITHUB_STEP_SUMMARY
            echo "Tamanho da ISO: $ISO_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "Tente fazer o upload manualmente ou rode o workflow novamente." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Executor: \`${RUNNER_NAME}\` (\`${RUNNER_OS}/${RUNNER_ARCH}\`)" >> $GITHUB_STEP_SUMMARY

      - name: Limpar temporários do runner
        if: always()
        run: |
          test -n "${GITHUB_WORKSPACE:-}"
          rm -rf -- "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/out"
