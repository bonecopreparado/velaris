---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
  requiredStorage: 18
  requiredRam: 2.0

  # Calamares considers the connection online when any endpoint answers with
  # data. The old archlinux.org/check_network_status.txt URL returns 404.
  internetCheckUrl:
    - "http://ping.archlinux.org/nm-check.txt"
    - "https://archlinux.org/"
    - "https://repo.cachyos.org/"

  check: [ storage, ram, power, root, screen, internet ]

  # Alternative kernels and graphics stacks are downloaded during installation,
  # so a working connection is required. Multiple probes avoid a single outage.
  required: [ storage, ram, root, internet ]

# Keep English as the predictable default. Users may choose any locale from
# the scrollable selector without requiring GeoIP.
geoip:
  style: "none"
  url: ""
  selector: ""

languageIcon: config-language
