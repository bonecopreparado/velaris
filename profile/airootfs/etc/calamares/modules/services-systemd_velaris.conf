---
units:
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: true
  - name: "NetworkManager-wait-online.service"
    action: "disable"
    mandatory: false
  - name: "sddm.service"
    action: "enable"
    mandatory: true
  - name: "bluetooth.service"
    action: "disable"
    mandatory: false
  - name: "cups.service"
    action: "disable"
    mandatory: false
  - name: "cups.socket"
    action: "enable"
    mandatory: false
  - name: "systemd-timesyncd.service"
    action: "enable"
    mandatory: false
  - name: "irqbalance.service"
    action: "enable"
    mandatory: false
  - name: "earlyoom.service"
    action: "enable"
    mandatory: false
  - name: "systemd-oomd.service"
    action: "mask"
    mandatory: false
  - name: "ananicy-cpp.service"
    action: "enable"
    mandatory: false
  - name: "fstrim.timer"
    action: "enable"
    mandatory: false
  - name: "paccache.timer"
    action: "enable"
    mandatory: false
  - name: "ufw.service"
    action: "enable"
    mandatory: false
  - name: "velaris-firstboot.service"
    action: "enable"
    mandatory: true
  - name: "velaris-performance-profile.service"
    action: "enable"
    mandatory: false
