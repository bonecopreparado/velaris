# Velaris — pacman.conf (runtime)

[options]
HoldPkg      = pacman glibc
Architecture = x86_64
Color
CheckSpace
ParallelDownloads = 5
ILoveCandy
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# CachyOS — assinaturas obrigatórias; o cachyos-keyring já vem instalado.
[cachyos]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/cachyos-mirrorlist

# CachyOS v3 — binários otimizados pra CPUs modernas (x86_64_v3)
# Só habilite se `ld.so --help` listar x86-64-v3 como suportado.
# [cachyos-v3]
# SigLevel = Required DatabaseOptional
# Server = https://mirror.cachyos.org/repo/x86_64_v3/$repo
