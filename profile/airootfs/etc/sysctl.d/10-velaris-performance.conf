# Velaris — Otimizações de performance

# Escrita em disco — reduz acúmulo de dados sujos na RAM
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Com ZRAM ativo, swappiness moderado move páginas ociosas pra ZRAM
vm.swappiness = 10

# Reduz agressividade ao liberar cache de inode/dentry
vm.vfs_cache_pressure = 50

# Monitoramento de arquivos — necessário pra IDEs e players grandes
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 256

# Buffers de rede maiores pra downloads e jogos online
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.netdev_max_backlog = 16384

# Evita travamentos por OOM agressivo
vm.oom_kill_allocating_task = 0
vm.overcommit_memory = 1
