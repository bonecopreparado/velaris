---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"

# ZRAM já é o swap rápido padrão; swap em disco continua disponível para
# máquinas que precisam de hibernação ou mais margem de memória.
userSwapChoices: [ none, file, small, suspend ]
initialSwapChoice: none

# LUKS1 é usado por compatibilidade previsível com o GRUB padrão do Arch.
luksGeneration: luks1
drawNestedPartitions: true
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: alongside
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
  enable: true
