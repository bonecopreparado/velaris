# Velaris — mkinitcpio.conf
# O hook kms inclui os módulos DRM disponíveis no perfil universal do Archiso.
# Evitar uma lista fixa reduz conflitos e acompanha novos kernels/drivers.

MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev microcode modconf kms plymouth memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
