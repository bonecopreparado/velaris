PATH /arch/boot/syslinux/
DEFAULT velaris
PROMPT 1
TIMEOUT 50
ONTIMEOUT velaris

LABEL velaris
  MENU LABEL Boot Velaris
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash zswap.enabled=0

LABEL velaris-nomodeset
  MENU LABEL Boot Velaris (nomodeset - graphics compatibility)
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset zswap.enabled=0

LABEL velaris-fallback
  MENU LABEL Boot Velaris (fallback)
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos-fallback.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% zswap.enabled=0
