---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "splash", "loglevel=3" ]
defaults:
  GRUB_TIMEOUT: 3
  GRUB_DEFAULT: "0"
  GRUB_TIMEOUT_STYLE: "menu"
  GRUB_DISABLE_SUBMENU: false
  GRUB_DISABLE_OS_PROBER: false
  GRUB_DISABLE_RECOVERY: true
always_use_defaults: true
