---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  # Velaris-owned configuration files use unique names so package upgrades
  # cannot silently replace them.
  - id: velaris
    module: welcome
    config: welcome_velaris.conf
  - id: kernel
    module: packagechooser
    config: packagechooser_kernel.conf
  - id: graphics
    module: packagechooser
    config: packagechooser_graphics.conf
  - id: profile
    module: packagechooser
    config: packagechooser_profile.conf
  - id: velaris
    module: partition
    config: partition_velaris.conf
  - id: velaris
    module: mount
    config: mount_velaris.conf
  - id: velaris
    module: unpackfs
    config: unpackfs_velaris.conf
  - id: velaris
    module: users
    config: users_velaris.conf
  - id: velaris
    module: displaymanager
    config: displaymanager_velaris.conf
  - id: velaris
    module: grubcfg
    config: grubcfg_velaris.conf
  - id: velaris
    module: bootloader
    config: bootloader_velaris.conf
  - id: velaris
    module: initcpiocfg
    config: initcpiocfg_velaris.conf
  - id: velaris
    module: services-systemd
    config: services-systemd_velaris.conf
  - id: velaris
    module: removeuser
    config: removeuser_velaris.conf
  - id: cleanup
    module: packages
    config: packages_cleanup.conf
  - id: firstboot
    module: shellprocess
    config: shellprocess_firstboot.conf
  - id: keyring
    module: shellprocess
    config: shellprocess_keyring.conf
  - id: selections
    module: contextualprocess
    config: contextualprocess_selections.conf
  - id: applyselections
    module: shellprocess
    config: shellprocess_applyselections.conf

sequence:
  - show:
    - welcome@velaris
    - locale
    - keyboard
    - packagechooser@kernel
    - packagechooser@graphics
    - packagechooser@profile
    - partition@velaris
    - users@velaris
    - summary
  - exec:
    - partition@velaris
    - mount@velaris
    - unpackfs@velaris
    - contextualprocess@selections
    - shellprocess@applyselections
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - luksopenswaphookcfg
    - initcpiocfg@velaris
    - initcpio
    - removeuser@velaris
    - users@velaris
    - networkcfg
    - displaymanager@velaris
    - hwclock
    - shellprocess@keyring
    - grubcfg@velaris
    - bootloader@velaris
    - services-systemd@velaris
    - shellprocess@firstboot
    - packages@cleanup
    - umount
  - show:
    - finished

branding: velaris
prompt-install: false
dont-chroot: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
