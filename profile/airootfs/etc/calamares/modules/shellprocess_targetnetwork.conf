---
# The SquashFS contains the build-time resolver, while the live session has
# the resolver supplied by the active NetworkManager connection. Copy that
# working resolver into the target before any chrooted package download.
dontChroot: true
timeout: 30
verbose: true
script:
  - command: "test -d ${ROOT}/etc && test ${ROOT} != /"
  - command: "rm -f ${ROOT}/etc/resolv.conf && install -m 0644 /etc/resolv.conf ${ROOT}/etc/resolv.conf"
i18n:
  name: "Preparing the installation network"
