---
# Confirma no sistema de destino os mesmos chaveiros usados pela sessão live.
dontChroot: false
timeout: 600
verbose: true
script:
  - command: "pacman-key --init"
    timeout: 300
  - command: "pacman-key --populate archlinux cachyos"
    timeout: 300
  - command: "pacman-key --finger F3B607488DB35A47"
    timeout: 60
i18n:
  name: "Preparing package signing keys"
