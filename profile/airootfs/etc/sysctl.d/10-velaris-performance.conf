# Velaris — Otimizações de performance

# Limites absolutos evitam rajadas gigantes de escrita em máquinas com muita
# RAM e travadinhas longas em HDDs mais lentos.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

# Com ZRAM (sem swap lento como padrão), comprimir páginas frias preserva mais
# cache de arquivos e reduz pressão de memória.
vm.swappiness = 100
vm.page-cluster = 0

# Reduz agressividade ao liberar cache de inode/dentry
vm.vfs_cache_pressure = 50

# Monitoramento de arquivos — necessário pra IDEs e players grandes
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 256

# Tetos de buffers maiores para conexões rápidas; os valores efetivos continuam
# sendo ajustados automaticamente pela pilha de rede.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
