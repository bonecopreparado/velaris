# Velaris — mkinitcpio.conf
# Módulos DRM de hardware real + todos os hypervisors comuns (VMware, QEMU/KVM,
# VirtualBox), pra garantir tela funcionando independente de onde a ISO rodar.

MODULES=(vmwgfx qxl virtio_gpu bochs amdgpu radeon i915 nouveau)
BINARIES=()
FILES=()
HOOKS=(base udev modconf memdisk archiso archiso_loop_mnt kms block filesystems keyboard)
COMPRESSION="zstd"
