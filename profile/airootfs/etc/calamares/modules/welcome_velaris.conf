---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
  requiredStorage: 18
  requiredRam: 2.0

  # Calamares considers the connection online when any endpoint answers with
  # data. The old archlinux.org/check_network_status.txt URL returns 404.
  internetCheckUrl:
    - "http://ping.archlinux.org/nm-check.txt"
    - "https://archlinux.org/"
    - "https://repo.cachyos.org/"

  check: [ storage, ram, power, root, screen, internet ]

  # Internet remains visible as a diagnostic, but it must not lock the Next
  # button on captive portals, filtered networks, or a temporary probe outage.
  required: [ storage, ram, root ]

# Keep English as the predictable default. Users may choose any locale from
# the scrollable selector without requiring a network connection.
geoip:
  style: "none"
  url: ""
  selector: ""

languageIcon: config-language
