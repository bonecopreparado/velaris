---
# Copia o sistema live, mas nunca leva a identidade ou os atalhos da sessão
# de instalação para o sistema final.
unpack:
  - source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
    sourcefs: "squashfs"
    destination: ""
    exclude:
      - "/home/velaris/"
      - "/etc/skel/.config/autostart/calamares.desktop"
      - "/etc/xdg/autostart/00-velaris-display-setup.desktop"
      - "/etc/sddm.conf.d/autologin.conf"
      - "/etc/sudoers.d/velaris"
      - "/etc/polkit-1/rules.d/49-calamares.rules"
      - "/etc/calamares/"
      - "/root/customize_airootfs.sh"
      - "/usr/share/applications/calamares.desktop"
      - "/usr/bin/velaris-calamares"
      - "/usr/lib/velaris-live/"
      - "/usr/lib/udev/rules.d/00-velaris-gpu-policy.rules"
      - "/usr/share/velaris/calamares/"
      - "/var/lib/AccountsService/users/velaris"
      - "/var/lib/AccountsService/icons/velaris"
