---
# Mount the target environment and create a predictable Btrfs layout.
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/cache
    subvolume: /@cache
  - mountPoint: /var/log
    subvolume: /@log

btrfsSwapSubvol: /@swap

# zstd:1 provides transparent compression with low CPU overhead. Avoid
# autodefrag because it can hurt virtual-machine images and database workloads.
mountOptions:
  - filesystem: default
    options: [ defaults ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd:1 ]
  - filesystem: btrfs_swap
    options: [ defaults, noatime ]
